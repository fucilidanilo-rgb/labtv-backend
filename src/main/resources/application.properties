
spring.application.name=labtv-backend

# Connessione MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configurazione JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Configurazione JWT
labtv.jwt.secret=${LABTV_JWT_SECRET}

# LABTV - Registrazione pubblica
labtv.registration.enabled=${REGISTRATION_ENABLED:false}

# LABTV - Frontend autorizzato
labtv.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
